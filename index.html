<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المجاهد | متجر احترافي</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahome;
}

body{
background:#f3f4f6;
direction:rtl;
transition:.3s;
}

.dark{
background:#111827;
color:white;
}

header{
background:#111827;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:28px;
font-weight:bold;
}

.nav-icons{
display:flex;
gap:15px;
align-items:center;
}

.icon-btn{
position:relative;
cursor:pointer;
font-size:22px;
}

.cart-count{
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
font-size:12px;
width:20px;
height:20px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
}

.hero{
height:400px;
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url('https://images.unsplash.com/photo-1472851294608-062f824d29cc?q=80&w=1200');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content h1{
font-size:55px;
margin-bottom:15px;
}

.hero-content p{
font-size:22px;
margin-bottom:25px;
}

.hero-btn{
background:#25D366;
padding:15px 30px;
border-radius:10px;
text-decoration:none;
color:white;
font-size:18px;
}

.container{
padding:30px 20px;
}

.top-bar{
display:flex;
gap:15px;
margin-bottom:25px;
flex-wrap:wrap;
}

.top-bar input,
.top-bar select{
padding:12px;
border-radius:10px;
border:1px solid #ccc;
flex:1;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
}

.dark .product{
background:#1f2937;
}

.product:hover{
transform:translateY(-7px);
}

.product img{
width:100%;
height:250px;
object-fit:cover;
}

.product-content{
padding:15px;
}

.product-content h3{
margin-bottom:10px;
}

.price{
font-size:24px;
color:#16a34a;
font-weight:bold;
margin-bottom:10px;
}

.rating{
color:gold;
margin-bottom:10px;
}

.actions{
display:flex;
gap:10px;
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.buy{
background:#111827;
color:white;
}

.cart{
background:#2563eb;
color:white;
}

.panel{
background:white;
padding:25px;
border-radius:15px;
margin-bottom:35px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.dark .panel{
background:#1f2937;
}

.panel h2{
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
}

.add-btn{
background:#111827;
color:white;
padding:14px;
border:none;
width:100%;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.toast{
position:fixed;
bottom:20px;
left:20px;
background:#111827;
color:white;
padding:15px 25px;
border-radius:10px;
display:none;
z-index:9999;
}

.cart-box{
position:fixed;
top:0;
left:-100%;
width:320px;
height:100%;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.2);
padding:20px;
overflow:auto;
transition:.4s;
z-index:99999;
}

.dark .cart-box{
background:#1f2937;
}

.cart-box.active{
left:0;
}

.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid #ccc;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:20px;
}

footer{
background:#111827;
color:white;
padding:30px;
text-align:center;
margin-top:50px;
}

@media(max-width:768px){

.hero-content h1{
font-size:35px;
}

.top-bar{
flex-direction:column;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
المجاهد
</div>

<div class="nav-icons">

<div class="icon-btn"
onclick="toggleDark()">
<i class="fas fa-moon"></i>
</div>

<div class="icon-btn"
onclick="openCart()">

<i class="fas fa-shopping-cart"></i>

<div class="cart-count"
id="cartCount">
0
</div>

</div>

</div>

</header>

<section class="hero">

<div class="hero-content">

<h1>متجر المجاهد</h1>

<p>
أفضل المنتجات بأفضل الأسعار
</p>

<a class="hero-btn"
href="https://wa.me/249963296885">

تواصل واتساب

</a>

</div>

</section>

<div class="container">

<div class="panel">

<h2>إضافة منتج</h2>

<input type="text"
id="title"
placeholder="اسم المنتج">

<input type="text"
id="price"
placeholder="السعر">

<textarea
id="desc"
placeholder="وصف المنتج"></textarea>

<input type="text"
id="category"
placeholder="القسم">

<input type="file"
id="image">

<button class="add-btn"
onclick="addProduct()">

إضافة المنتج

</button>

</div>

<div class="top-bar">

<input type="text"
id="search"
placeholder="بحث...">

<select id="filter">

<option value="all">
كل الأقسام
</option>

</select>

</div>

<div class="products"
id="products">
</div>

</div>

<div class="cart-box"
id="cartBox">

<h2>
سلة المشتريات
</h2>

<div id="cartItems">
</div>

<div class="total"
id="total">
الإجمالي: 0
</div>

</div>

<div class="toast"
id="toast">
تمت الإضافة للسلة
</div>

<footer>

<p>
📍 مدني - حي المنيرة
</p>

<p>
📞 249963296885+
</p>

<p>
© متجر المجاهد 2026
</p>

</footer>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

function saveData(){

localStorage.setItem(
"products",
JSON.stringify(products)
);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

}

function showToast(msg){

let toast =
document.getElementById("toast");

toast.innerText = msg;

toast.style.display="block";

setTimeout(()=>{
toast.style.display="none";
},2000);

}

function addProduct(){

let title =
document.getElementById("title").value;

let price =
document.getElementById("price").value;

let desc =
document.getElementById("desc").value;

let category =
document.getElementById("category").value;

let image =
document.getElementById("image").files[0];

if(!title || !price || !desc || !category || !image){

alert("املأ كل الحقول");

return;

}

let reader = new FileReader();

reader.onload = function(e){

products.push({

title,
price,
desc,
category,
image:e.target.result

});

saveData();

renderProducts();

updateFilter();

showToast("تمت إضافة المنتج");

};

reader.readAsDataURL(image);

}

function renderProducts(){

let productsBox =
document.getElementById("products");

productsBox.innerHTML="";

products.forEach((product,index)=>{

productsBox.innerHTML += `

<div class="product">

<img src="${product.image}">

<div class="product-content">

<h3>${product.title}</h3>

<div class="price">
${product.price}
</div>

<div class="rating">
★★★★★
</div>

<p>${product.desc}</p>

<p>
📦 ${product.category}
</p>

<div class="actions">

<button class="btn cart"
onclick="addToCart(${index})">

أضف للسلة

</button>

<a class="btn buy"
href="https://wa.me/249963296885?text=أريد طلب ${product.title}">

شراء

</a>

</div>

</div>

</div>

`;

});

}

function addToCart(index){

cart.push(products[index]);

saveData();

renderCart();

showToast("تمت الإضافة للسلة");

}

function renderCart(){

let cartItems =
document.getElementById("cartItems");

cartItems.innerHTML="";

let total = 0;

cart.forEach(item=>{

total += parseInt(item.price);

cartItems.innerHTML += `

<div class="cart-item">

<div>
${item.title}
</div>

<div>
${item.price}
</div>

</div>

`;

});

document.getElementById("total")
.innerText =
"الإجمالي: " + total;

document.getElementById("cartCount")
.innerText = cart.length;

}

function openCart(){

document.getElementById("cartBox")
.classList.toggle("active");

}

function toggleDark(){

document.body.classList.toggle("dark");

}

document.getElementById("search")
.addEventListener("keyup",function(){

let value =
this.value.toLowerCase();

let all =
document.querySelectorAll(".product");

all.forEach(product=>{

product.style.display =
product.innerText
.toLowerCase()
.includes(value)
? "block"
: "none";

});

});

function updateFilter(){

let filter =
document.getElementById("filter");

let categories =
["all"];

products.forEach(p=>{

if(!categories.includes(p.category)){

categories.push(p.category);

}

});

filter.innerHTML="";

categories.forEach(cat=>{

filter.innerHTML += `

<option value="${cat}">
${cat}
</option>

`;

});

}

document.getElementById("filter")
.addEventListener("change",function(){

let value = this.value;

let all =
document.querySelectorAll(".product");

all.forEach((product,index)=>{

if(value=="all"){

product.style.display="block";

}else{

product.style.display =
products[index].category == value
? "block"
: "none";

}

});

});

renderProducts();

renderCart();

updateFilter();

</script>

</body>
</html>
