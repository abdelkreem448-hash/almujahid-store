<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متجر المجاهد</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma;
}

body{
background:#f1f3f6;
direction:rtl;
overflow-x:hidden;
}

header{
background:#111827;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:28px;
font-weight:bold;
}

.search-box{
width:40%;
position:relative;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
outline:none;
}

.hero{
height:350px;
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1200');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content h1{
font-size:50px;
margin-bottom:15px;
}

.hero-content p{
font-size:20px;
margin-bottom:20px;
}

.whatsapp-btn{
background:#25D366;
padding:15px 30px;
color:white;
text-decoration:none;
border-radius:10px;
font-size:18px;
display:inline-block;
transition:.3s;
}

.whatsapp-btn:hover{
transform:scale(1.05);
}

.container{
padding:40px 20px;
}

.section-title{
font-size:35px;
margin-bottom:30px;
text-align:center;
color:#111827;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
position:relative;
}

.product:hover{
transform:translateY(-8px);
}

.product img{
width:100%;
height:250px;
object-fit:cover;
}

.product-content{
padding:15px;
}

.product-content h3{
margin-bottom:10px;
color:#111827;
}

.price{
font-size:22px;
color:#16a34a;
margin-bottom:10px;
font-weight:bold;
}

.product-content p{
color:#555;
margin-bottom:15px;
}

.actions{
display:flex;
gap:10px;
}

.buy-btn,.delete-btn{
flex:1;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
text-decoration:none;
text-align:center;
}

.buy-btn{
background:#111827;
color:white;
}

.delete-btn{
background:#dc2626;
color:white;
}

.panel{
background:white;
padding:25px;
border-radius:15px;
margin-bottom:40px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.panel h2{
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
outline:none;
}

button{
background:#111827;
color:white;
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:17px;
width:100%;
}

button:hover{
background:#374151;
}

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:40px;
}

.stat{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.stat h3{
font-size:35px;
color:#111827;
margin-bottom:10px;
}

footer{
background:#111827;
color:white;
padding:30px;
text-align:center;
margin-top:50px;
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

.search-box{
width:100%;
}

.hero-content h1{
font-size:35px;
}

}

</style>
</head>
<body>

<header>

<div class="logo">
المجاهد
</div>

<div class="search-box">
<input type="text" id="search"
placeholder="ابحث عن منتج...">
</div>

</header>

<section class="hero">

<div class="hero-content">

<h1>متجر المجاهد</h1>

<p>
مدني - حي المنيرة
</p>

<a class="whatsapp-btn"
href="https://wa.me/249963296885"
target="_blank">

<i class="fab fa-whatsapp"></i>

تواصل واتساب

</a>

</div>

</section>

<div class="container">

<div class="stats">

<div class="stat">
<h3 id="countProducts">0</h3>
<p>عدد المنتجات</p>
</div>

<div class="stat">
<h3>24/7</h3>
<p>الدعم الفني</p>
</div>

<div class="stat">
<h3>100%</h3>
<p>جودة المنتجات</p>
</div>

</div>

<div class="panel">

<h2>إضافة منتج جديد</h2>

<input type="text"
id="title"
placeholder="اسم المنتج">

<input type="text"
id="price"
placeholder="السعر">

<textarea
id="desc"
placeholder="وصف المنتج"></textarea>

<input type="file" id="image">

<button onclick="addProduct()">
إضافة المنتج
</button>

</div>

<h2 class="section-title">
المنتجات
</h2>

<div class="products"
id="products">
</div>

</div>

<footer>

<p>
📍 مدني - حي المنيرة
</p>

<p>
📞 249963296885+
</p>

<p>
© 2026 متجر المجاهد
</p>

</footer>

<script>

let products = JSON.parse(
localStorage.getItem("products")
) || [];

function saveProducts(){
localStorage.setItem(
"products",
JSON.stringify(products)
);
}

function renderProducts(){

let productsContainer =
document.getElementById("products");

productsContainer.innerHTML="";

products.forEach((product,index)=>{

productsContainer.innerHTML += `

<div class="product">

<img src="${product.image}">

<div class="product-content">

<h3>${product.title}</h3>

<div class="price">
${product.price}
</div>

<p>${product.desc}</p>

<div class="actions">

<a class="buy-btn"
href="https://wa.me/249963296885?text=مرحباً أريد طلب ${product.title}"
target="_blank">

شراء

</a>

<button class="delete-btn"
onclick="deleteProduct(${index})">

حذف

</button>

</div>

</div>

</div>

`;

});

document.getElementById(
"countProducts"
).innerText = products.length;

}

function addProduct(){

let title =
document.getElementById("title").value;

let price =
document.getElementById("price").value;

let desc =
document.getElementById("desc").value;

let image =
document.getElementById("image").files[0];

if(!title || !price || !desc || !image){

alert("املأ جميع الحقول");

return;

}

let reader = new FileReader();

reader.onload = function(e){

let product = {

title:title,

price:price,

desc:desc,

image:e.target.result

};

products.push(product);

saveProducts();

renderProducts();

document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("desc").value="";
document.getElementById("image").value="";

};

reader.readAsDataURL(image);

}

function deleteProduct(index){

products.splice(index,1);

saveProducts();

renderProducts();

}

document.getElementById("search")
.addEventListener("keyup",function(){

let value = this.value.toLowerCase();

let allProducts =
document.querySelectorAll(".product");

allProducts.forEach(product=>{

let text =
product.innerText.toLowerCase();

product.style.display =
text.includes(value)
? "block"
: "none";

});

});

renderProducts();

</script>

</body>
</html>
