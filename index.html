<style>

/* =========================
تصميم احترافي كامل
========================= */

body{
background:#eef2ff;
font-family:'Tahoma';
color:#111827;
}

/* الهيدر */

header{
background:linear-gradient(90deg,#0f172a,#1e293b);
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.logo{
font-size:32px;
font-weight:bold;
color:white;
letter-spacing:1px;
}

/* زر التحكم */

.control-btn{
position:fixed;
bottom:25px;
left:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:linear-gradient(45deg,#16a34a,#22c55e);
color:white;
font-size:28px;
cursor:pointer;
z-index:999999;
box-shadow:0 8px 25px rgba(0,0,0,.25);
transition:.3s;
}

.control-btn:hover{
transform:scale(1.08);
}

/* البانر */

.hero{
height:550px;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url('https://images.unsplash.com/photo-1586773860418-d37222d8fce3?q=80&w=1400');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
border-bottom-left-radius:40px;
border-bottom-right-radius:40px;
overflow:hidden;
}

.hero-content{
max-width:850px;
animation:fadeUp 1s ease;
}

.hero-content h1{
font-size:70px;
color:white;
margin-bottom:20px;
font-weight:bold;
}

.hero-content p{
font-size:26px;
color:#f8fafc;
line-height:1.9;
margin-bottom:35px;
}

.hero-btn{
background:linear-gradient(45deg,#16a34a,#22c55e);
padding:18px 40px;
border-radius:14px;
color:white;
font-size:22px;
text-decoration:none;
display:inline-block;
transition:.3s;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.hero-btn:hover{
transform:translateY(-5px);
}

/* العناوين */

.section-title{
text-align:center;
font-size:42px;
margin-bottom:45px;
color:#0f172a;
position:relative;
}

.section-title::after{
content:'';
width:90px;
height:5px;
background:#16a34a;
display:block;
margin:15px auto;
border-radius:50px;
}

/* الحاوية */

.container{
padding:70px 25px;
}

/* الكروت */

.cards,
.departments,
.doctors-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

/* تصميم الكارد */

.card,
.department,
.doctor{
background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.4s;
position:relative;
}

.card:hover,
.department:hover,
.doctor:hover{
transform:translateY(-10px);
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

/* الخدمات */

.card{
padding:35px;
text-align:center;
}

.card i{
font-size:60px;
margin-bottom:20px;
color:#16a34a;
}

.card h3{
font-size:28px;
margin-bottom:15px;
}

.card p{
line-height:2;
font-size:17px;
color:#6b7280;
}

/* الأقسام */

.department{
padding:30px;
border-top:6px solid #16a34a;
}

.department h3{
font-size:28px;
margin-bottom:18px;
color:#16a34a;
}

.department p{
line-height:2;
font-size:17px;
color:#4b5563;
}

/* الأطباء */

.doctor img{
width:100%;
height:320px;
object-fit:cover;
}

.doctor-content{
padding:25px;
text-align:center;
}

.doctor-content h3{
font-size:28px;
margin-bottom:12px;
color:#0f172a;
}

.doctor-content p{
font-size:18px;
margin-bottom:10px;
color:#6b7280;
}

/* الأزرار */

.add-btn,
.delete-btn,
.book-btn{
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:17px;
width:100%;
margin-top:12px;
transition:.3s;
font-weight:bold;
}

.add-btn{
background:linear-gradient(45deg,#16a34a,#22c55e);
color:white;
}

.delete-btn{
background:linear-gradient(45deg,#dc2626,#ef4444);
color:white;
}

.book-btn{
background:linear-gradient(45deg,#0f172a,#1e293b);
color:white;
}

.add-btn:hover,
.delete-btn:hover,
.book-btn:hover{
transform:translateY(-3px);
}

/* لوحة التحكم */

.dashboard{
position:fixed;
top:0;
left:-100%;
width:100%;
height:100%;
background:#f8fafc;
overflow:auto;
padding:35px;
transition:.4s;
z-index:999999;
}

.dashboard.active{
left:0;
}

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.dashboard-header h2{
font-size:38px;
color:#0f172a;
}

.close-dashboard{
background:red;
color:white;
border:none;
width:45px;
height:45px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.dashboard-box{
background:white;
padding:30px;
border-radius:22px;
margin-bottom:30px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.dashboard-box h3{
margin-bottom:20px;
font-size:28px;
color:#16a34a;
}

/* الفورم */

input,
textarea,
select{
width:100%;
padding:16px;
border-radius:14px;
border:1px solid #d1d5db;
margin-bottom:18px;
font-size:17px;
outline:none;
transition:.3s;
background:white;
}

input:focus,
textarea:focus,
select:focus{
border-color:#16a34a;
box-shadow:0 0 0 4px rgba(34,197,94,.15);
}

/* الفوتر */

footer{
background:linear-gradient(90deg,#0f172a,#1e293b);
color:white;
padding:50px 20px;
text-align:center;
margin-top:70px;
border-top-left-radius:35px;
border-top-right-radius:35px;
}

footer p{
margin-bottom:12px;
font-size:19px;
}

/* أنيميشن */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* الجوال */

@media(max-width:768px){

.hero{
height:500px;
}

.hero-content h1{
font-size:42px;
}

.hero-content p{
font-size:20px;
}

.section-title{
font-size:32px;
}

.dashboard{
padding:20px;
}

}

</style>
