<!-- ضع هذا الجزء بدل قسم الأطباء القديم بالكامل -->

<h2 class="section-title">
الأطباء
</h2>

<div class="doctors-grid"
id="doctorsGrid">
</div>

<!-- لوحة التحكم -->

<div class="admin-panel"
id="adminPanel">

<button class="close-admin"
onclick="toggleAdminPanel()">
✕
</button>

<h2 style="margin-bottom:20px;">
لوحة التحكم
</h2>

<!-- إضافة دكتور -->

<input type="text"
id="doctorName"
placeholder="اسم الدكتور">

<input type="text"
id="doctorJob"
placeholder="التخصص">

<input type="file"
id="doctorImage"
accept="image/*">

<button class="add-btn"
onclick="addDoctor()">

إضافة دكتور

</button>

<hr style="margin:25px 0;">

<!-- إضافة صور للمستشفى -->

<input type="file"
id="hospitalImages"
accept="image/*"
multiple>

<button class="add-btn"
onclick="addHospitalImages()">

إضافة صور للمستشفى

</button>

<hr style="margin:25px 0;">

<button class="book-btn"
onclick="changeHospitalName()">

تغيير اسم المستشفى

</button>

<button class="book-btn"
onclick="changePhone()">

تغيير رقم الهاتف

</button>

<button class="book-btn"
onclick="changeHeroText()">

تغيير النص الرئيسي

</button>

<button class="book-btn"
onclick="toggleDarkMode()">

الوضع الليلي

</button>

</div>

<!-- معرض الصور -->

<h2 class="section-title">
صور المستشفى
</h2>

<div class="gallery-grid"
id="galleryGrid">

</div>

<script>

/* =========================
صور المستشفى
========================= */

let hospitalImages =
JSON.parse(localStorage.getItem("hospitalImages")) || [

"https://images.unsplash.com/photo-1587351021759-3e566b6af7cc?q=80&w=1200",

"https://images.unsplash.com/photo-1579684385127-1ef15d508118?q=80&w=1200",

"https://images.unsplash.com/photo-1516549655169-df83a0774514?q=80&w=1200"

];

function saveHospitalImages(){

localStorage.setItem(
"hospitalImages",
JSON.stringify(hospitalImages)
);

}

function renderHospitalImages(){

let gallery =
document.getElementById("galleryGrid");

gallery.innerHTML = "";

hospitalImages.forEach((img,index)=>{

gallery.innerHTML += `

<div>

<img src="${img}">

<button class="delete-btn"
onclick="deleteHospitalImage(${index})">

حذف الصورة

</button>

</div>

`;

});

}

function addHospitalImages(){

let files =
document.getElementById("hospitalImages").files;

if(files.length == 0){

alert("اختر صور");

return;

}

Array.from(files).forEach(file=>{

let reader =
new FileReader();

reader.readAsDataURL(file);

reader.onload = function(e){

hospitalImages.push(e.target.result);

saveHospitalImages();

renderHospitalImages();

};

});

alert("تمت إضافة الصور");

}

/* =========================
الدكاترة
========================= */

let doctors =
JSON.parse(localStorage.getItem("doctors")) || [];

function saveDoctors(){

localStorage.setItem(
"doctors",
JSON.stringify(doctors)
);

}

function renderDoctors(){

let box =
document.getElementById("doctorsGrid");

box.innerHTML = "";

doctors.forEach((doctor,index)=>{

box.innerHTML += `

<div class="doctor">

<img src="${doctor.image}">

<div class="doctor-content">

<h3>
${doctor.name}
</h3>

<p>
${doctor.job}
</p>

<button class="delete-btn"
onclick="deleteDoctor(${index})">

حذف الدكتور

</button>

</div>

</div>

`;

});

}

function addDoctor(){

let name =
document.getElementById("doctorName").value;

let job =
document.getElementById("doctorJob").value;

let image =
document.getElementById("doctorImage").files[0];

if(!name || !job || !image){

alert("املأ جميع الحقول");

return;

}

let reader =
new FileReader();

reader.readAsDataURL(image);

reader.onload = function(e){

doctors.push({

name:name,
job:job,
image:e.target.result

});

saveDoctors();

renderDoctors();

document.getElementById("doctorName").value="";
document.getElementById("doctorJob").value="";
document.getElementById("doctorImage").value="";

alert("تمت إضافة الدكتور");

};

}

function deleteDoctor(index){

if(confirm("هل تريد حذف الدكتور؟")){

doctors.splice(index,1);

saveDoctors();

renderDoctors();

}

}

/* =========================
حذف صور المستشفى
========================= */

function deleteHospitalImage(index){

if(confirm("هل تريد حذف الصورة؟")){

hospitalImages.splice(index,1);

saveHospitalImages();

renderHospitalImages();

}

}

/* =========================
الحجز
========================= */

function sendBooking(){

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let department =
document.getElementById("department").value;

let details =
document.getElementById("details").value;

if(
!name ||
!phone ||
!department ||
!details
){

alert("املأ جميع الحقول");

return;

}

alert("تم إرسال الحجز بنجاح");

}

/* =========================
لوحة التحكم
========================= */

function toggleAdminPanel(){

document
.getElementById("adminPanel")
.classList.toggle("active");

}

function changeHospitalName(){

let newName =
prompt("اسم المستشفى الجديد");

if(newName){

document.querySelector(".logo")
.innerHTML =
"🏥 " + newName;

document.querySelector(".hero-content h1")
.innerText =
newName;

}

}

function changePhone(){

let phone =
prompt("رقم الهاتف الجديد");

if(phone){

document.getElementById("footerPhone")
.innerHTML =
"📞 " + phone;

document.querySelector(".hero-btn")
.href =
"https://wa.me/" + phone;

}

}

function changeHeroText(){

let text =
prompt("النص الجديد");

if(text){

document.querySelector(".hero-content p")
.innerText =
text;

}

}

function toggleDarkMode(){

document.body.classList.toggle("dark-mode");

}

/* =========================
تشغيل الموقع
========================= */

renderDoctors();

renderHospitalImages();

</script>
