<!-- زر لوحة التحكم -->

<button class="control-btn"
onclick="openDashboard()">

⚙️ لوحة التحكم

</button>

<!-- لوحة التحكم الكبيرة -->

<div class="dashboard"
id="dashboard">

<div class="dashboard-header">

<h2>
لوحة التحكم
</h2>

<button class="close-dashboard"
onclick="closeDashboard()">

✕

</button>

</div>

<!-- تعديل اسم المستشفى -->

<div class="dashboard-box">

<h3>
تعديل اسم المستشفى
</h3>

<input type="text"
id="hospitalNameInput"
placeholder="اسم المستشفى الجديد">

<button class="add-btn"
onclick="updateHospitalName()">

حفظ الاسم

</button>

</div>

<!-- تعديل الرقم -->

<div class="dashboard-box">

<h3>
تعديل رقم الهاتف
</h3>

<input type="text"
id="phoneInput"
placeholder="رقم الهاتف">

<button class="add-btn"
onclick="updatePhone()">

حفظ الرقم

</button>

</div>

<!-- إضافة قسم -->

<div class="dashboard-box">

<h3>
إضافة قسم طبي
</h3>

<input type="text"
id="deptTitle"
placeholder="اسم القسم">

<textarea
id="deptDesc"
placeholder="وصف القسم"></textarea>

<button class="add-btn"
onclick="addDepartment()">

إضافة القسم

</button>

</div>

<!-- إضافة خدمة -->

<div class="dashboard-box">

<h3>
إضافة خدمة
</h3>

<input type="text"
id="serviceTitle"
placeholder="اسم الخدمة">

<textarea
id="serviceDesc"
placeholder="وصف الخدمة"></textarea>

<button class="add-btn"
onclick="addService()">

إضافة الخدمة

</button>

</div>

<!-- إضافة دكتور -->

<div class="dashboard-box">

<h3>
إضافة دكتور
</h3>

<input type="text"
id="doctorName"
placeholder="اسم الدكتور">

<input type="text"
id="doctorJob"
placeholder="التخصص">

<input type="file"
id="doctorImage">

<button class="add-btn"
onclick="addDoctor()">

إضافة الدكتور

</button>

</div>

<!-- إضافة صور -->

<div class="dashboard-box">

<h3>
إضافة صور للمستشفى
</h3>

<input type="file"
id="hospitalImages"
multiple>

<button class="add-btn"
onclick="addHospitalImages()">

رفع الصور

</button>

</div>

</div>

<style>

.control-btn{
position:fixed;
bottom:20px;
left:20px;
background:#16a34a;
color:white;
border:none;
padding:15px 20px;
border-radius:50px;
font-size:18px;
cursor:pointer;
z-index:999999;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.dashboard{
position:fixed;
top:0;
left:-100%;
width:100%;
height:100%;
background:#f3f4f6;
overflow:auto;
padding:30px;
transition:.4s;
z-index:999999;
}

.dashboard.active{
left:0;
}

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.close-dashboard{
background:red;
color:white;
border:none;
width:40px;
height:40px;
border-radius:50%;
font-size:20px;
cursor:pointer;
}

.dashboard-box{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.dashboard-box h3{
margin-bottom:15px;
color:#16a34a;
}

</style>

<script>

/* =========================
فتح وإغلاق لوحة التحكم
========================= */

function openDashboard(){

document
.getElementById("dashboard")
.classList.add("active");

}

function closeDashboard(){

document
.getElementById("dashboard")
.classList.remove("active");

}

/* =========================
تعديل اسم المستشفى
========================= */

function updateHospitalName(){

let name =
document.getElementById("hospitalNameInput").value;

if(name){

document.querySelector(".logo")
.innerHTML =
"🏥 " + name;

document.querySelector(".hero-content h1")
.innerText =
name;

localStorage.setItem(
"hospitalName",
name
);

alert("تم حفظ الاسم");

}

}

/* =========================
تعديل الرقم
========================= */

function updatePhone(){

let phone =
document.getElementById("phoneInput").value;

if(phone){

document.getElementById("footerPhone")
.innerHTML =
"📞 " + phone;

document.querySelector(".hero-btn")
.href =
"https://wa.me/" + phone;

localStorage.setItem(
"hospitalPhone",
phone
);

alert("تم حفظ الرقم");

}

}

/* =========================
الخدمات
========================= */

let services =
JSON.parse(localStorage.getItem("services")) || [];

function renderServices(){

let box =
document.getElementById("servicesContainer");

box.innerHTML = "";

services.forEach((service,index)=>{

box.innerHTML += `

<div class="card">

<h3>
${service.title}
</h3>

<p>
${service.desc}
</p>

<button class="delete-btn"
onclick="deleteService(${index})">

حذف

</button>

</div>

`;

});

}

function addService(){

let title =
document.getElementById("serviceTitle").value;

let desc =
document.getElementById("serviceDesc").value;

if(!title || !desc){

alert("املأ الحقول");

return;

}

services.push({
title,
desc
});

localStorage.setItem(
"services",
JSON.stringify(services)
);

renderServices();

alert("تمت إضافة الخدمة");

}

function deleteService(index){

services.splice(index,1);

localStorage.setItem(
"services",
JSON.stringify(services)
);

renderServices();

}

/* =========================
الأقسام
========================= */

let departments =
JSON.parse(localStorage.getItem("departments")) || [];

function renderDepartments(){

let box =
document.getElementById("departmentsContainer");

box.innerHTML = "";

departments.forEach((dept,index)=>{

box.innerHTML += `

<div class="department">

<h3>
${dept.title}
</h3>

<p>
${dept.desc}
</p>

<button class="delete-btn"
onclick="deleteDepartment(${index})">

حذف القسم

</button>

</div>

`;

});

}

function addDepartment(){

let title =
document.getElementById("deptTitle").value;

let desc =
document.getElementById("deptDesc").value;

if(!title || !desc){

alert("املأ الحقول");

return;

}

departments.push({
title,
desc
});

localStorage.setItem(
"departments",
JSON.stringify(departments)
);

renderDepartments();

alert("تمت إضافة القسم");

}

function deleteDepartment(index){

departments.splice(index,1);

localStorage.setItem(
"departments",
JSON.stringify(departments)
);

renderDepartments();

}

/* =========================
تحميل البيانات
========================= */

window.onload = function(){

renderServices();

renderDepartments();

let savedName =
localStorage.getItem("hospitalName");

if(savedName){

document.querySelector(".logo")
.innerHTML =
"🏥 " + savedName;

document.querySelector(".hero-content h1")
.innerText =
savedName;

}

let savedPhone =
localStorage.getItem("hospitalPhone");

if(savedPhone){

document.getElementById("footerPhone")
.innerHTML =
"📞 " + savedPhone;

document.querySelector(".hero-btn")
.href =
"https://wa.me/" + savedPhone;

}

}

</script>

<!-- ضع هذا مكان الخدمات -->

<div class="cards"
id="servicesContainer">
</div>

<!-- ضع هذا مكان الأقسام -->

<div class="departments"
id="departmentsContainer">
</div>
